<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anmelden | Mein Fortschritt</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      background: #ffffff;
      color: #171717;

      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      width: min(1100px, calc(100% - 40px));
      height: 82px;

      margin: 0 auto;

      display: flex;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      color: #171717;
      text-decoration: none;

      font-weight: 700;
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: #2f8f5b;
      color: white;
    }

    /* MAIN */

    main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 20px 100px;
    }

    .maintenance {
      max-width: 560px;

      text-align: center;
    }

    .status-icon {
      width: 72px;
      height: 72px;

      margin: 0 auto 30px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: #eef8f2;
      color: #2f8f5b;

      font-size: 30px;
      font-weight: 600;
    }

    .label {
      display: block;

      margin-bottom: 17px;

      color: #2f8f5b;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(42px, 7vw, 64px);

      line-height: 1.05;

      letter-spacing: -0.045em;

      font-weight: 600;
    }

    p {
      max-width: 480px;

      margin: 22px auto 0;

      color: #6f746f;

      font-size: 17px;

      line-height: 1.7;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 54px;

      margin-top: 36px;
      padding: 0 28px;

      border-radius: 13px;

      background: #2f8f5b;
      color: white;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition: 0.2s ease;
    }

    .back-button:hover {
      background: #247249;
      transform: translateY(-1px);
    }

    .small-note {
      margin-top: 20px;

      font-size: 12px;

      color: #9a9d9a;
    }

    @media (max-width: 600px) {
      header {
        height: 70px;
      }

      main {
        align-items: flex-start;
        padding-top: 90px;
      }

      .status-icon {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>

<body>

  <header>

    <a href="index.html" class="brand">

      <span class="brand-icon">
        M
      </span>

      <span>
        Mein Fortschritt
      </span>

    </a>

  </header>


  <main>

    <section class="maintenance">

      <div class="status-icon">
        ✓
      </div>

      <span class="label">
        Wir arbeiten daran
      </span>

      <h1>
        Bald für dich verfügbar.
      </h1>

      <p>
        Der persönliche Bereich befindet sich derzeit noch im Aufbau.
        Wir arbeiten daran, dir hier bald deinen eigenen Bereich
        für Ziele, Fortschritte und Ernährung anzubieten.
      </p>

      <a href="index.html" class="back-button">
        Zurück zum BMI-Rechner
      </a>

      <div class="small-note">
        Danke für deine Geduld.
      </div>

    </section>

  </main>

</body>
</html>
